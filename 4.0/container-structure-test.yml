schemaVersion: 2.0.0

fileExistenceTests:
  - name: "qBittorrent/"
    path: /root/.config/qBittorrent
    shouldExist: true
  - name: "qBittorrent.conf"
    path: /root/.config/qBittorrent/qBittorrent.conf
    shouldExist: false

commandTests:
  - name: "entrypoint.sh"
    command: "./entrypoint.sh"
    args: ["echo", "ok"]
    expectedOutput: ["ok"]
    excludedError: [".+"]
    exitCode: 0

  - name: "which qbittorrent-nox"
    command: "which"
    args: ["qbittorrent-nox"]
    expectedOutput: ["/usr/local/bin/qbittorrent-nox"]
    excludedError: [".+"]
    exitCode: 0

  - name: "qbittorrent-nox --version"
    command: "qbittorrent-nox"
    args: ["--version"]
    # Release versions only, not pre-releases such as "v5.3.0rc1"
    expectedOutput: ["^qBittorrent v4\\.0\\.[0-9]+(\\.[0-9]+)*\\s*$"]
    excludedError: [".+"]
    exitCode: 0

  # Start qBittorrent in the foreground (without the entrypoint's internet check), and make
  # sure the WebUI responds and the process is still running
  - name: "qbittorrent-nox starts up"
    command: "sh"
    args:
      - "-c"
      - |
        set -eu
        cp /qBittorrent.conf /config/qBittorrent.conf
        # Always print qBittorrent's output, even if the checks below fail
        trap 'cat /tmp/qbittorrent.out' EXIT
        qbittorrent-nox > /tmp/qbittorrent.out 2>&1 &
        PID=$!
        for _ in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:8080/ && break
            sleep 1
        done
        curl --silent --fail --output /dev/null --write-out "WebUI HTTP %{http_code}\n" http://localhost:8080/ || true
        kill -0 "${PID}" && echo "qbittorrent-nox is running"
        kill "${PID}"
        wait "${PID}" || true
    expectedOutput: ["WebUI HTTP 200", "qbittorrent-nox is running"]
    exitCode: 0

  - name: "./entrypoint.sh qbittorrent-nox --daemon"
    command: "./entrypoint.sh"
    args: ["qbittorrent-nox", "--daemon"]
    expectedOutput: ["Waiting for internet connection", "External IP"]
    excludedError: [".+"]
    exitCode: 0
